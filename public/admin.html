<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MCF Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/mcf.css">
</head>
<body data-shell="none">
    <script src="/js/mcf-shell.js"></script>
    <div class="signin" id="signin" style="display:none">
        <div class="signin-inner">
            <div class="signin-brand"><strong>MCF</strong><span>Soluciones</span></div>

            <!-- Step 1: who -->
            <div id="step-user" class="card sub-flow active fade-in">
                <p class="signin-title">¿Quién eres?</p>
                <div class="user-list">
                    <button class="user-chip wide" onclick="selectAdmin()">Admin<span class="admin-badge">Con PIN</span></button>
                    <button class="user-chip" onclick="selectUser('joanna')">Joanna</button>
                    <button class="user-chip" onclick="selectUser('kenia')">Kenia</button>
                </div>
            </div>

            <!-- Step 2: the PIN says which owner it is -->
            <div id="step-pin" class="card sub-flow fade-in">
                <button class="back-btn" onclick="goBack()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Cambiar usuario
                </button>
                <p class="signin-title">Introduzca su PIN</p>
                <div class="field-stack">
                    <input type="password" id="pin-input" class="password-input" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN de 6 dígitos" aria-label="PIN" onkeypress="handlePinKeypress(event)" oninput="handlePinInput()">
                    <p id="pin-error" class="error-message" role="alert">PIN incorrecto</p>
                    <button class="btn btn-primary" onclick="checkPin()">Continuar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Step 3: Inicio, drawn by /js/mcf-shell.js -->
    <div class="container wide" id="home" style="display:none"></div>

    <script>
        // Read by the shell and /reporte to know who is signed in. The server keeps its own proof, in cookies.
        const ADMIN_SESSION_KEY = 'mcf_admin_authenticated';
        let checking = false;

        function saveAdminSession(user) {
            sessionStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({
                authenticated: true,
                user: user,
                timestamp: Date.now()
            }));
        }

        function selectAdmin() {
            showStep('pin');
            document.getElementById('pin-input').focus();
        }

        function selectUser(user) {
            MCF.setUser(user);
            showHome();
        }

        function handlePinKeypress(event) {
            if (event.key === 'Enter') {
                checkPin();
            }
        }

        function handlePinInput() {
            if (document.getElementById('pin-input').value.length === 6) {
                checkPin();
            }
        }

        function showPinError(text) {
            const input = document.getElementById('pin-input');
            const error = document.getElementById('pin-error');
            error.textContent = text;
            error.classList.add('visible');
            input.classList.add('error', 'shake');
            setTimeout(() => input.classList.remove('shake'), 300);
        }

        async function checkPin() {
            const input = document.getElementById('pin-input');
            if (checking || !input.value) return;
            checking = true;
            document.getElementById('pin-error').classList.remove('visible');
            input.classList.remove('error');
            try {
                const res = await fetch('/api/auth/pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: input.value })
                });
                const data = await res.json();
                if (!res.ok) {
                    showPinError(data.error || 'No se pudo comprobar el PIN');
                    return;
                }
                saveAdminSession(data.user);
                showHome();
            } catch (err) {
                showPinError('No se pudo comprobar el PIN');
            } finally {
                checking = false;
                input.value = '';
            }
        }

        // Show step
        function showStep(step) {
            document.querySelectorAll('.sub-flow').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById('step-' + step).classList.add('active');
        }

        // Leave the sign-in and show Inicio with the navigation
        function showHome() {
            document.getElementById('signin').style.display = 'none';
            document.body.dataset.shell = 'app';
            MCF.refresh();
            const home = document.getElementById('home');
            home.style.display = 'block';
            MCF.renderHome(home);
        }

        // Go back
        function goBack() {
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-error').classList.remove('visible');
            document.getElementById('pin-input').classList.remove('error');
            showStep('user');
        }

        // Initialize: whoever already signed in goes straight to Inicio, also in a new tab
        (async () => {
            if (MCF.currentUser()) return showHome();
            try {
                const me = await (await fetch('/api/auth/pin', { cache: 'no-store' })).json();
                if (me.user) {
                    saveAdminSession(me.user);
                    return showHome();
                }
            } catch (err) { /* sign in as usual */ }
            document.getElementById('signin').style.display = '';
        })();
    </script>
</body>
</html>
