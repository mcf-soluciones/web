<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Deposito a Cuenta</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/mcf.css">
    <script src="/js/mcf-gate.js" data-level="session"></script>
</head>
<body data-shell="app">
    <script src="/js/mcf-shell.js"></script>
    <div class="container">
        <a href="/admin.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Volver al panel
        </a>

        <div class="header">
            <h1>Deposito a Cuenta</h1>
            <p>Registrar deposito de efectivo al banco</p>
        </div>

        <!-- Form -->
        <div id="form-card" class="card fade-in">
            <form id="deposito-form">
                <!-- Property Selection -->
                <div class="form-group">
                    <label class="form-label">Propiedad / Sucursal</label>
                    <select class="form-select" id="propiedad-select" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="hortaleza">Hortaleza</option>
                        <option value="usera">Usera</option>
                    </select>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label class="form-label">Cantidad depositada</label>
                    <input type="number" step="0.01" min="0" class="form-input" id="amount-input" placeholder="0.00" required>
                    <p class="form-hint">Ingresa el monto total del deposito en euros</p>
                </div>

                <div class="amount-display">
                    <div class="label">Total a depositar</div>
                    <div class="value" id="amount-display">0.00 EUR</div>
                </div>

                <button type="submit" class="btn btn-cyan">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    Registrar Deposito
                </button>
            </form>
        </div>

        <!-- Completion Message -->
        <div id="completion-message" class="card fade-in">
            <div class="completion-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h3 class="card-title">Deposito registrado</h3>
            <p class="completion-text">El deposito ha sido registrado correctamente.</p>
            <a href="/admin.html" class="btn btn-primary">Volver al panel</a>
        </div>

        <div class="footer">
            MCF Soluciones - Deposito a Cuenta
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <div class="loading-text">Registrando deposito...</div>
        </div>
    </div>

    <script>
        // State
        let depositoData = {
            user: null,
            propiedad: null
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Read URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const urlUser = urlParams.get('user');

            if (urlUser) {
                depositoData.user = urlUser;
            }

            // Update amount display on input
            document.getElementById('amount-input').addEventListener('input', updateAmountDisplay);

            // Setup form submission
            document.getElementById('deposito-form').addEventListener('submit', handleSubmit);
        });

        function updateAmountDisplay() {
            const amount = parseFloat(document.getElementById('amount-input').value) || 0;
            document.getElementById('amount-display').textContent = amount.toFixed(2) + ' EUR';
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const amount = parseFloat(document.getElementById('amount-input').value);
            const propiedad = document.getElementById('propiedad-select').value;

            if (!propiedad) {
                alert('Por favor selecciona una propiedad/sucursal');
                return;
            }

            if (!amount || amount <= 0) {
                alert('Por favor ingresa una cantidad valida');
                return;
            }

            depositoData.propiedad = propiedad;
            document.getElementById('loading-overlay').classList.add('active');

            try {
                await submitToNotionAPI(amount);

                document.getElementById('loading-overlay').classList.remove('active');
                document.getElementById('form-card').style.display = 'none';
                document.getElementById('completion-message').style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading-overlay').classList.remove('active');
                alert('Error al registrar. Intentalo de nuevo.');
            }
        }

        function submitToNotionAPI(amount) {
            const URL = "/api/movimientos";

            const formattedData = {
                type: 'deposito',
                mcf_user: depositoData.user,
                propiedad: depositoData.propiedad,
                euros: amount,
                account: 'cash'
            };

            console.log('Sending deposito data to Notion:', formattedData);

            return $.ajax({
                type: "POST",
                url: URL,
                dataType: "json",
                crossDomain: true,
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify(formattedData),
            });
        }
    </script>
</body>
</html>
