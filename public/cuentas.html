<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MCF · Acceso Contable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/mcf.css">
</head>
<body data-shell="none">
    <script src="/js/mcf-shell.js"></script>
    <div class="signin">
        <div class="signin-inner">
            <div class="signin-brand"><strong>MCF</strong><span>Acceso contable</span></div>
            <div class="card">
                <p class="signin-title">Consulta los gastos y el P&amp;L.</p>
                <form id="login-form" class="field-stack">
                    <div>
                        <label class="form-label" for="pwd">Contraseña</label>
                        <input class="input" id="pwd" type="password" autocomplete="off" autofocus required>
                    </div>
                    <button class="btn btn-primary" id="submit" type="submit">Entrar</button>
                    <div id="error" class="alert alert-danger" style="display:none;"></div>
                </form>
                <p class="form-hint mt-4">Acceso de solo lectura a las pestañas Gastos y P&amp;L.</p>
            </div>
        </div>
    </div>

  <script>
    // Already signed in? Skip the form. The server knows; this tab's memory might not.
    fetch('/api/auth/pin', { cache: 'no-store' })
      .then(r => r.json())
      .then(me => { if (me.accountant) location.replace('/reporte#gastos'); })
      .catch(() => { /* the form is still here */ });

    const form = document.getElementById('login-form');
    const pwd = document.getElementById('pwd');
    const btn = document.getElementById('submit');
    const errBox = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verificando…';
      try {
        const r = await fetch('/api/auth/cuentas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd.value }),
        });
        if (r.ok) {
          location.replace('/reporte#gastos');
          return;
        }
        const data = await r.json().catch(() => ({}));
        errBox.textContent = data.error || `Error ${r.status}`;
        errBox.style.display = 'block';
      } catch (err) {
        errBox.textContent = 'Error de red. Intenta de nuevo.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
