<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/mcf.css">
</head>
<body data-shell="bare">
    <script src="/js/mcf-shell.js"></script>
    <div class="container">
        <div class="header">
            <h1>Restablecer Datos de Sesión</h1>
            <p>Si tienes problemas para iniciar una nueva visita, presiona este botón para borrar todos los datos de la sesión anterior.</p>
        </div>
        <button id="reset-button" class="btn btn-danger btn-lg">Borrar Datos y Reiniciar</button>
        <div id="confirmation-message" class="alert alert-success mt-4" style="display: none;">
            ¡Listo! Todos los datos de la sesión han sido borrados. Ahora puedes cerrar esta ventana e iniciar una nueva visita.
        </div>
    </div>

    <script>
        document.getElementById('reset-button').addEventListener('click', () => {
            if (confirm("¿Estás seguro de que quieres borrar todos los datos de la sesión? Esta acción no se puede deshacer.")) {
                // Clear all local storage data for this site
                localStorage.clear();
                // Clear all session storage data for this site
                sessionStorage.clear();
                // And the sign-in, which page scripts cannot reach
                fetch('/api/auth/pin', { method: 'DELETE' });

                // Hide the button and show the confirmation message
                document.getElementById('reset-button').style.display = 'none';
                document.getElementById('confirmation-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
